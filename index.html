<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上點餐與定位系統</title>
    <!-- Tailwind CSS 樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet 地圖 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet 地圖 JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto max-w-4xl p-4">
        <!-- 標題 -->
        <header class="bg-white shadow rounded-lg p-4 mb-4 text-center">
            <h1 class="text-2xl font-bold text-gray-800">🍔 線上點餐與外送定位系統</h1>
            <p class="text-sm text-gray-500">選擇餐點並確認您的外送位置</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- 左側：菜單與購物車 -->
            <div class="bg-white shadow rounded-lg p-4 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold mb-3 border-b pb-2">📋 菜單列表</h2>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center border p-2 rounded-lg">
                            <div>
                                <h3 class="font-medium">招牌起司漢堡</h3>
                                <p class="text-sm text-gray-500">$ 150</p>
                            </div>
                            <button onclick="addToCart('招牌起司漢堡', 150)" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">加入</button>
                        </div>
                        <div class="flex justify-between items-center border p-2 rounded-lg">
                            <div>
                                <h3 class="font-medium">黃金脆薯</h3>
                                <p class="text-sm text-gray-500">$ 60</p>
                            </div>
                            <button onclick="addToCart('黃金脆薯', 60)" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">加入</button>
                        </div>
                        <div class="flex justify-between items-center border p-2 rounded-lg">
                            <div>
                                <h3 class="font-medium">可口可樂</h3>
                                <p class="text-sm text-gray-500">$ 40</p>
                            </div>
                            <button onclick="addToCart('可口可樂', 40)" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">加入</button>
                        </div>
                    </div>

                    <h2 class="text-lg font-semibold mt-6 mb-3 border-b pb-2">🛒 購物車</h2>
                    <ul id="cart-list" class="text-sm text-gray-600 space-y-1 mb-3 min-h-[50px]">
                        <li class="text-gray-400">目前購物車是空的</li>
                    </ul>
                    <div class="font-bold text-right mb-4">總金額：$ <span id="total-price">0</span></div>
                </div>

                <button onclick="submitOrder()" class="w-full bg-green-500 text-white py-2 rounded-lg font-semibold hover:bg-green-600">送出訂單</button>
            </div>

            <!-- 右側：地圖與定位 -->
            <div class="bg-white shadow rounded-lg p-4 flex flex-col">
                <h2 class="text-lg font-semibold mb-3 border-b pb-2">📍 外送定位系統</h2>
                <p class="text-xs text-gray-500 mb-2">點擊下方按鈕自動取得您的GPS位置，或直接在地圖上點擊來修改外送位置。</p>
                
                <button onclick="locateUser()" class="bg-indigo-500 text-white py-1.5 px-3 rounded text-sm mb-3 hover:bg-indigo-600">自動取得目前GPS位置</button>
                
                <!-- 地圖容器 -->
                <div id="map" class="w-full h-64 rounded-lg border flex-grow"></div>
                
                <div class="mt-3 text-xs text-gray-600">
                    <p>目前選擇座標：</p>
                    <p class="font-mono bg-gray-50 p-1 rounded mt-1 border">緯度: <span id="lat-val">未取得</span>, 經度: <span id="lng-val">未取得</span></p>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 1. 初始化購物車資料
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById('cart-list');
            const totalPriceEl = document.getElementById('total-price');
            cartList.innerHTML = '';
            total = 0;

            if (cart.length === 0) {
                cartList.innerHTML = '<li class="text-gray-400">目前購物車是空的</li>';
                totalPriceEl.textContent = '0';
                return;
            }

            cart.forEach((item, index) => {
                total += item.price;
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center';
                li.innerHTML = `<span>${item.name}</span> <span>$${item.price}</span>`;
                cartList.appendChild(li);
            });
            totalPriceEl.textContent = total;
        }

        // 2. 初始化 Leaflet 地圖 (預設中心點設為台灣台北車站附近)
        const map = L.map('map').setView([25.0478, 121.5170], 15);

        // 載入 OpenStreetMap 圖資
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker;

        // 設定地圖點擊事件（允許手動微調位置）
        map.on('click', function(e) {
            setMarker(e.latlng.lat, e.latlng.lng);
        });

        function setMarker(lat, lng) {
            document.getElementById('lat-val').textContent = lat.toFixed(5);
            document.getElementById('lng-val').textContent = lng.toFixed(5);

            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map);
            }
            map.setView([lat, lng], 16);
        }

        // 3. 取得使用者 GPS 定位
        function locateUser() {
            if (!navigator.geolocation) {
                alert('您的瀏覽器不支援地理定位功能');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    setMarker(lat, lng);
                },
                (error) => {
                    alert('無法取得您的定位，請檢查瀏覽器權限或手動在地圖上點擊。');
                }
            );
        }

        // 4. 送出訂單模擬
        function submitOrder() {
            if (cart.length === 0) {
                alert('購物車是空的，請先選擇餐點！');
                return;
            }
            const lat = document.getElementById('lat-val').textContent;
            const lng = document.getElementById('lng-val').textContent;

            if (lat === '未取得') {
                alert('請先在地圖上選擇或取得外送定位！');
                return;
            }

            alert(`訂單送出成功！\n總金額：$${total}\n外送座標：(${lat}, ${lng})\n感謝您的點餐！`);
        }
    </script>
</body>
</html>
