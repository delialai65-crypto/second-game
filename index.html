<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 麥塊多人連線遊戲 - 全域伺服器與好友系統</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; 
            background: linear-gradient(135deg, #1a1a2e, #16213e); 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        .card {
            background: rgba(30, 30, 30, 0.9); 
            backdrop-filter: blur(12px);
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            width: 500px; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { 
            margin-top: 0;
            margin-bottom: 20px; 
            color: #4CAF50; 
            letter-spacing: 2px; 
            font-size: 24px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.4);
        }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #aaa; }
        .input-group input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444;
            background: #222; color: #fff; outline: none; transition: 0.3s; font-size: 14px;
        }
        .input-group input:focus { 
            border-color: #4CAF50; 
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.4); 
            background: #282828;
        }
        .btn {
            width: 100%; padding: 12px; background: #4CAF50; color: white; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
            margin-top: 10px;
        }
        .btn:hover { background: #43a047; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4); }
        .switch-btn { background: none; border: none; color: #aaa; font-size: 13px; margin-top: 15px; cursor: pointer; }
        .switch-btn:hover { color: #fff; text-decoration: underline; }
        
        #lobby-screen, #game-screen, #createServer-screen { display: none; }
        
        .server-item, .friend-item {
            background: rgba(40, 40, 40, 0.8);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
            font-size: 14px;
        }
        
        #game-screen { position: relative; text-align: center; }
        #gameCanvas { 
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF); 
            border: 3px solid #333; 
            border-radius: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            cursor: crosshair;
        }
        .room-info { margin-bottom: 8px; font-size: 13px; color: #ddd; }
        .error-text { color: #ff5252; font-size: 13px; margin-top: 8px; }

        .modal-box {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #4CAF50;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 10;
            text-align: left;
        }
        .inventory-bar {
            margin-top: 6px;
            background: rgba(0,0,0,0.5);
            padding: 6px;
            border-radius: 6px;
            display: flex;
            justify-content: space-around;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- 1. 登入/註冊畫面 -->
    <div id="auth-screen" class="card">
        <h2 id="form-title">MECRAFT 2D</h2>
        <div class="input-group">
            <label>使用者帳號</label>
            <input type="text" id="username" placeholder="請輸入帳號">
        </div>
        <div class="input-group">
            <label>使用者密碼</label>
            <input type="password" id="password" placeholder="請輸入密碼">
        </div>
        <button class="btn" id="submit-btn" onclick="handleAuth()">登入遊戲</button>
        <button class="switch-btn" onclick="toggleAuthMode()">沒有帳號？點此註冊</button>
        <p id="auth-msg" class="error-text"></p>
    </div>

    <!-- 2. 伺服器與好友大廳畫面 -->
    <div id="lobby-screen" class="card" style="width: 540px;">
        <h2>遊戲大廳</h2>
        <p class="room-info">當前登入玩家: <span id="welcome-user" style="color: #FFEB3B; font-weight: bold;"></span> 
            <button onclick="logout()" style="margin-left: 10px; padding: 2px 6px; background: #666; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:11px;">登出</button>
        </p>
        
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn" style="margin-top: 0; background: #2196F3;" onclick="showCreateServer()">建立新伺服器</button>
        </div>

        <div style="display: flex; gap: 15px;">
            <!-- 左側：伺服器列表 -->
            <div style="flex: 1.2; text-align: left;">
                <div style="font-size: 13px; margin-bottom: 5px; color: #ccc;">全域伺服器列表：</div>
                <div id="server-list" style="max-height: 160px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 6px;"></div>
            </div>
            <!-- 右側：好友清單 -->
            <div style="flex: 1; text-align: left;">
                <div style="font-size: 13px; margin-bottom: 5px; color: #ccc;">好友清單：</div>
                <div id="friend-list" style="max-height: 110px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 6px; margin-bottom: 8px;"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="add-friend-input" placeholder="輸入好友帳號" style="padding: 6px; width: 68%; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; font-size: 12px; outline: none;">
                    <button class="btn" style="width: 32%; margin-top: 0; padding: 6px; font-size: 11px; background: #9c27b0;" onclick="addFriend()">加好友</button>
                </div>
            </div>
        </div>
        <p id="lobby-msg" class="error-text"></p>
    </div>

    <!-- 3. 建立伺服器畫面 -->
    <div id="createServer-screen" class="card">
        <h2>建立伺服器</h2>
        <div class="input-group">
            <label>伺服器名稱</label>
            <input type="text" id="new-server-name" placeholder="輸入伺服器名稱">
        </div>
        <div class="input-group">
            <label>伺服器 ID (朋友可用來搜尋)</label>
            <input type="text" id="new-server-id" placeholder="例如: mine01">
        </div>
        <button class="btn" onclick="createServer()">確認建立並擔任管理員</button>
        <button class="switch-btn" onclick="backToLobby()">返回大廳</button>
        <p id="create-msg" class="error-text"></p>
    </div>

    <!-- 4. 2D 麥塊遊戲畫面 -->
    <div id="game-screen">
        <div class="room-info">
            伺服器: <span id="current-server-name" style="color: #FFEB3B; font-weight: bold;"></span> | 
            身分: <span id="player-role" style="color: #4CAF50; font-weight: bold;">玩家</span> | 
            <span style="color: #FF9800;">[E] 合成面板</span> <span id="admin-tip" style="display:none; color: #E91E63;">| [K] 管理員踢人</span>
            <button onclick="backToLobby()" style="margin-left: 10px; padding: 3px 8px; background: #f44336; color: #fff; border: none; border-radius: 4px; cursor: pointer;">離開</button>
        </div>
        
        <canvas id="gameCanvas" width="800" height="440"></canvas>

        <div class="inventory-bar">
            <span>土方塊: <b id="inv-dirt" style="color:#8B4513">10</b></span>
            <span>合成藍方塊: <b id="inv-blue" style="color:#00BCD4">5</b></span>
            <span>土製鎬: <b id="inv-pickaxe" style="color:#FF9800">0</b></span>
            <span>手持: <b id="current-holding" style="color:#FFEB3B">土方塊 [1]</b></span>
        </div>

        <!-- E 鍵合成視窗 -->
        <div id="crafting-modal" class="modal-box">
            <h3 style="margin-top:0; color:#4CAF50;">🛠️ 合成工作台</h3>
            <div style="background: rgba(50,50,50,0.8); border: 1px solid #666; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div><b>土製鎬</b><br><small style="color:#aaa">需求: 3 個土方塊</small></div>
                <button class="btn" style="width: auto; padding: 6px 12px; margin-top:0;" onclick="craftItem('pickaxe')">合成</button>
            </div>
            <button class="btn" style="background:#f44336; margin-top:5px;" onclick="toggleModal('crafting-modal')">關閉面板</button>
        </div>

        <!-- K 鍵管理員踢人視窗 -->
        <div id="admin-modal" class="modal-box" style="border-color: #E91E63;">
            <h3 style="margin-top:0; color:#E91E63;">🛡️ 管理員控制台</h3>
            <div class="input-group" style="margin-bottom: 10px;">
                <label>輸入要踢出的玩家帳號</label>
                <input type="text" id="kick-target-input" placeholder="輸入玩家帳號">
            </div>
            <button class="btn" style="background: #E91E63; margin-top: 0;" onclick="kickPlayer()">踢出伺服器</button>
            <button class="btn" style="background: #666; margin-top: 5px;" onclick="toggleModal('admin-modal')">關閉</button>
        </div>
    </div>

    <script>
        let localUsers = JSON.parse(localStorage.getItem('mc_users') || '[]');
        let friendships = JSON.parse(localStorage.getItem('mc_friends') || '{}');
        
        let myUsername = '';
        let currentServer = null;
        let isAdmin = false;
        let isRegisterMode = false;

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('form-title').innerText = isRegisterMode ? '建立新帳號' : 'MECRAFT 2D';
            document.getElementById('submit-btn').innerText = isRegisterMode ? '註冊' : '登入遊戲';
            document.querySelector('.switch-btn').innerText = isRegisterMode ? '已有帳號？返回登入' : '沒有帳號？點此註冊';
            document.getElementById('auth-msg').innerText = '';
        }

        function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgEl = document.getElementById('auth-msg');

            if (!username || !password) {
                msgEl.innerText = '帳號與密碼不得為空！';
                return;
            }

            if (isRegisterMode) {
                if (localUsers.find(u => u.username === username)) {
                    msgEl.innerText = '此帳號已被註冊！';
                    return;
                }
                localUsers.push({ username, password });
                localStorage.setItem('mc_users', JSON.stringify(localUsers));
                alert('註冊成功！請登入');
                toggleAuthMode();
            } else {
                const user = localUsers.find(u => u.username === username && u.password === password);
                if (!user) {
                    msgEl.innerText = '帳號或密碼錯誤！';
                    return;
                }
                myUsername = username;
                document.getElementById('welcome-user').innerText = myUsername;
                document.getElementById('auth-screen').style.display = 'none';
                openLobby();
            }
        }

        function logout() {
            myUsername = '';
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function openLobby() {
            document.getElementById('createServer-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';
            loadServerList();
            loadFriendList();
        }

        // 取得全域伺服器列表 (使用 localStorage.getItem 確保不同帳號同步讀取)
        function getGlobalServers() {
            return JSON.parse(localStorage.getItem('mc_global_servers') || '[]');
        }

        function loadServerList() {
            const servers = getGlobalServers();
            const listEl = document.getElementById('server-list');
            listEl.innerHTML = '';

            if (servers.length === 0) {
                listEl.innerHTML = '<div style="color: #777; text-align: center; padding: 10px; font-size:12px;">尚無伺服器</div>';
                return;
            }

            servers.forEach(srv => {
                const item = document.createElement('div');
                item.className = 'server-item';
                item.innerHTML = `
                    <div style="text-align: left;">
                        <b style="color:#FFEB3B">${srv.name}</b><br>
                        <small style="color:#aaa">ID: ${srv.id} | 管理員: ${srv.host}</small>
                    </div>
                    <button class="btn" style="width: auto; padding: 4px 10px; margin-top: 0; font-size: 12px;" onclick="joinServer('${srv.id}')">加入</button>
                `;
                listEl.appendChild(item);
            });
        }

        function loadFriendList() {
            friendships = JSON.parse(localStorage.getItem('mc_friends') || '{}');
            const myFriends = friendships[myUsername] || [];
            const listEl = document.getElementById('friend-list');
            listEl.innerHTML = '';

            if (myFriends.length === 0) {
                listEl.innerHTML = '<div style="color: #777; text-align: center; padding: 8px; font-size:12px;">尚無好友</div>';
                return;
            }

            myFriends.forEach(fName => {
                const item = document.createElement('div');
                item.className = 'friend-item';
                item.innerHTML = `
                    <span>👤 ${fName}</span>
                    <span style="color: #4CAF50; font-size: 11px;">線上</span>
                `;
                listEl.appendChild(item);
            });
        }

        function addFriend() {
            const friendName = document.getElementById('add-friend-input').value.trim();
            const msgEl = document.getElementById('lobby-msg');
            if (!friendName) return;

            if (friendName === myUsername) {
                msgEl.innerText = '不能加自己為好友！';
                return;
            }

            if (!localUsers.find(u => u.username === friendName)) {
                msgEl.innerText = '找不到此玩家帳號！';
                return;
            }

            friendships = JSON.parse(localStorage.getItem('mc_friends') || '{}');
            if (!friendships[myUsername]) friendships[myUsername] = [];
            
            if (friendships[myUsername].includes(friendName)) {
                msgEl.innerText = '對方已經是你的好友了！';
                return;
            }

            friendships[myUsername].push(friendName);
            localStorage.setItem('mc_friends', JSON.stringify(friendships));
            document.getElementById('add-friend-input').value = '';
            msgEl.innerText = '';
            loadFriendList();
            alert(`成功與 ${friendName} 成為好友！`);
        }

        function showCreateServer() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('createServer-screen').style.display = 'block';
            document.getElementById('new-server-name').value = '';
            document.getElementById('new-server-id').value = '';
            document.getElementById('create-msg').innerText = '';
        }

        function backToLobby() {
            document.getElementById('crafting-modal').style.display = 'none';
            document.getElementById('admin-modal').style.display = 'none';
            openLobby();
        }

        function createServer() {
            const name = document.getElementById('new-server-name').value.trim();
            const id = document.getElementById('new-server-id').value.trim();
            const msgEl = document.getElementById('create-msg');

            if (!name || !id) {
                msgEl.innerText = '名稱與 ID 不得為空！';
                return;
            }

            let servers = getGlobalServers();
            if (servers.find(s => s.id === id)) {
                msgEl.innerText = '此伺服器 ID 已被使用！';
                return;
            }

            const newSrv = { id, name, host: myUsername };
            servers.push(newSrv);
            localStorage.setItem('mc_global_servers', JSON.stringify(servers));

            startServerGame(newSrv, true);
        }

        function joinServer(id) {
            const servers = getGlobalServers();
            const srv = servers.find(s => s.id === id);
            if (!srv) {
                alert('找不到此伺服器！');
                loadServerList();
                return;
            }
            const isHost = (srv.host === myUsername);
            startServerGame(srv, isHost);
        }

        function startServerGame(srv, isHost) {
            currentServer = srv;
            isAdmin = isHost;

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('createServer-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            document.getElementById('current-server-name').innerText = srv.name;
            document.getElementById('player-role').innerText = isAdmin ? '管理員 (Admin)' : '一般玩家';
            document.getElementById('player-role').style.color = isAdmin ? '#E91E63' : '#4CAF50';
            document.getElementById('admin-tip').style.display = isAdmin ? 'inline' : 'none';

            initGameEngine();
        }

        function toggleModal(modalId) {
            const el = document.getElementById(modalId);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        function kickPlayer() {
            const target = document.getElementById('kick-target-input').value.trim();
            if (!target) return;
            if (target === myUsername) {
                alert('不能踢出自己！');
                return;
            }
            alert(`已成功將玩家 [${target}] 踢出伺服器！`);
            document.getElementById('kick-target-input').value = '';
            toggleModal('admin-modal');
        }

        let gameInventory = { dirt: 10, blue: 5, pickaxe: 0 };
        let selectedTool = 1;

        function craftItem(type) {
            if (type === 'pickaxe' && gameInventory.dirt >= 3) {
                gameInventory.dirt -= 3;
                gameInventory.pickaxe += 1;
                alert('成功合成「土製鎬」！');
            } else {
                alert('材料不足！需要 3 個土方塊');
            }
            updateInventoryUI();
        }

        function updateInventoryUI() {
            document.getElementById('inv-dirt').innerText = gameInventory.dirt;
            document.getElementById('inv-blue').innerText = gameInventory.blue;
            document.getElementById('inv-pickaxe').innerText = gameInventory.pickaxe;
            document.getElementById('current-holding').innerText = selectedTool === 1 ? '土方塊 [1]' : '合成藍方塊 [2]';
        }

        // 2D 遊戲引擎
        function initGameEngine() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const TILE_SIZE = 40;
            const mapCols = 20;
            const mapRows = 11;

            let worldMap = Array(mapRows).fill(0).map(() => Array(mapCols).fill(1));
            for (let r = 0; r < mapRows; r++) {
                for (let c = 0; c < mapCols; c++) {
                    if (r < 5) worldMap[r][c] = 0;
                }
            }

            let player = { x: 100, y: 120, w: 26, h: 36, vx: 0, vy: 0, speed: 4 };
            let keys = {};

            window.addEventListener('keydown', e => {
                const key = e.key.toLowerCase();
                if (key === 'e') { toggleModal('crafting-modal'); return; }
                if (key === 'k' && isAdmin) { toggleModal('admin-modal'); return; }

                keys[key] = true;
                if (e.key === '1') selectedTool = 1;
                else if (e.key === '2') selectedTool = 2;
                updateInventoryUI();
            });

            window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

            canvas.addEventListener('mousedown', e => {
                const rect = canvas.getBoundingClientRect();
                const clickX = Math.floor((e.clientX - rect.left) / TILE_SIZE);
                const clickY = Math.floor((e.clientY - rect.top) / TILE_SIZE);

                if (clickX >= 0 && clickX < mapCols && clickY >= 0 && clickY < mapRows) {
                    if (e.button === 0) {
                        if (worldMap[clickY][clickX] > 0) {
                            gameInventory.dirt += 1;
                            worldMap[clickY][clickX] = 0;
                            updateInventoryUI();
                        }
                    } else if (e.button === 2) {
                        if (worldMap[clickY][clickX] === 0) {
                            if (selectedTool === 1 && gameInventory.dirt > 0) {
                                gameInventory.dirt--;
                                worldMap[clickY][clickX] = 1;
                            } else if (selectedTool === 2 && gameInventory.blue > 0) {
                                gameInventory.blue--;
                                worldMap[clickY][clickX] = 2;
                            }
                            updateInventoryUI();
                        }
                    }
                }
            });
            canvas.addEventListener('contextmenu', e => e.preventDefault());

            function update() {
                if (keys['a'] || keys['arrowleft']) player.vx = -player.speed;
                else if (keys['d'] || keys['arrowright']) player.vx = player.speed;
                else player.vx = 0;

                if ((keys['w'] || keys['arrowup'] || keys[' ']) && Math.abs(player.vy) < 0.1) {
                    player.vy = -10;
                }

                player.vy += 0.5;
                player.x += player.vx;
                player.y += player.vy;

                if (player.y > 5 * TILE_SIZE - player.h) {
                    player.y = 5 * TILE_SIZE - player.h;
                    player.vy = 0;
                }
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let r = 0; r < mapRows; r++) {
                    for (let c = 0; c < mapCols; c++) {
                        if (worldMap[r][c] === 1) {
                            ctx.fillStyle = '#8B4513';
                            ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
                            ctx.fillStyle = '#2E8B57';
                            ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE - 1, 10);
                        } else if (worldMap[r][c] === 2) {
                            ctx.fillStyle = '#00BCD4';
                            ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
                        }
                    }
                }

                ctx.fillStyle = isAdmin ? '#E91E63' : '#FF5722';
                ctx.fillRect(player.x, player.y, player.w, player.h);

                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(myUsername + (isAdmin ? ' (管理員)' : ''), player.x + player.w / 2, player.y - 6);
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            updateInventoryUI();
            loop();
        }
    </script>
</body>
</html>
